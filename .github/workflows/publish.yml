name: publish

# Releases are manual: push to main does NOT publish. Merge your batch of fixes,
# then trigger this workflow (Actions → publish → Run workflow, or `gh workflow run
# publish --ref main`) when the batch is ready to ship.
#
#   1. bump the patch version (the repository's package.json is the version source of truth)
#   2. prebuild the production bundle (.next, cache excluded) into the package —
#      users install a ready-to-run artifact with zero compilation on their machine
#   3. run the prepublishOnly gate (typecheck + tests) and publish to npm
#   4. push the version commit and a v* tag back to main
#   5. create a GitHub Release for the tag (notes = commit history since the previous tag)
# Publishing only happens after the gate passes, and an already-published version
# is bumped past, so a re-run never fails on E403.
#
# Requires the repository secret NPM_TOKEN (npm Automation token). The bot commit
# it pushes back does not re-trigger this workflow, and the actor guard covers
# manual re-runs on that commit.
on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write # push the version bump commit and the tag
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Bump the patch version past anything already published
        id: version
        run: |
          set -euo pipefail
          for _ in $(seq 1 50); do
            npm version patch --no-git-tag-version >/dev/null
            version="$(node -p "require('./package.json').version")"
            if ! npm view "@rexvane/piweb@$version" version >/dev/null 2>&1; then break; fi
            echo "@rexvane/piweb@$version is already published; bumping again"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing @rexvane/piweb@$version"

      # Windows 平台包：直接分发官方 niubash portable 归档（完整 winuxcmd/、bundles/，
      # 不是只拿 niu.exe），版本固定为 <niubash 版本>-piweb.N，因此只在缺失时发布一次；
      # 主包的 optionalDependencies 精确锁定该版本，npm 按 os/cpu 自动挑对应包。
      - name: Prepare the managed Windows shell packages
        run: node scripts/prepare-niubash-packages.mjs

      - name: Publish the managed Windows shell packages
        run: |
          set -euo pipefail
          for dir in platform-packages/*/; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; leaving it untouched"
              continue
            fi
            ( cd "$dir" && npm publish --provenance --access public )
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 这里**故意不重写 lockfile**：平台包用"无版本的可选占位条目"就已经满足 npm ci（实测退出码 0），
      # 安装方会按 package.json 里的精确版本去 registry 取。反过来，`npm install --package-lock-only`
      # 在任一平台上都会剪掉 @tailwindcss/oxide-wasm32-wasi 下那批 @emnapi 条目、留下悬空引用，
      # 下一次 CI 的 npm ci 直接 EUSAGE（Missing: @emnapi/wasi-threads@1.2.3 from lock file）。
      # 需要更新 lock 时：从干净检出手工补条目，先跑 `npm ci --dry-run` 复验再提交。

      # 预构建：发布物自带 .next 产物（排除 cache），用户安装后零编译直接运行——
      # 安装时构建在 macOS 上踩了一串坑（staging 目录/junction/执行位），成品发布根除。
      - name: Prebuild the production bundle
        run: |
          set -euo pipefail
          node --max-old-space-size=8192 node_modules/next/dist/bin/next build --webpack
          rm -rf .next/cache .next/diagnostics .next/trace .next/trace-build
          rm -rf .next-releases
          test -f .next/BUILD_ID
          du -sh .next

      # 打包前用真实 tarball 校验 .next 完整（files 是白名单，漏一个 Next 清单
      # 就会发出「装得上、起不来」的包），同时校验两个 Windows 平台包的每个 runtime 文件哈希。
      - name: Verify the packed artifact runs
        run: npm run verify:package

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PIWEB_SKIP_INSTALL_BUILD: "1"
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/piweb-publish-agent
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Push the version commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
          git push origin "v${{ steps.version.outputs.version }}"

      # npm 发布的同时创建 GitHub Release：说明文字 = 上一个版本以来的提交历史（去 merge 提交）
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="$prev..$tag"
          else
            range="$tag"
          fi
          notes="$(git log --format='- %s (%h)' --no-merges "$range")"
          gh release create "$tag" --title "v$version" --notes "$notes" --latest
        env:
          GH_TOKEN: ${{ github.token }}
