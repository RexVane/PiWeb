name: publish

# Releases are manual: push to main does NOT publish. Merge your batch of fixes,
# then trigger this workflow (Actions → publish → Run workflow, or `gh workflow run
# publish --ref main`) when the batch is ready to ship.
#
#   1. use the version already reviewed and merged through a PR
#   2. prebuild and verify the production package with a clean installation
#   3. run the typecheck/test publish gate, then publish to npm
#   4. push only the version tag and create a GitHub Release
# The workflow never writes to main. Update package.json/package-lock.json and
# docs/state/progress.md on rexvane-piweb before merging the release PR.
#
# Requires the repository secret NPM_TOKEN. Only a user-triggered run on main
# can publish; version changes are reviewed in the release PR.
on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # push the version tag and create the release
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Validate the release version from the merged PR
        id: version
        run: |
          set -euo pipefail
          version="$(node -e 'const v = require("./package.json").version; if (!/^\d+\.\d+\.\d+$/.test(v)) process.exit(1); console.log(v);')"
          if npm view "@rexvane/piweb@$version" version >/dev/null 2>&1; then
            echo "Version $version is already published; bump the version through a PR first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing @rexvane/piweb@$version"

      # 预构建：发布物自带 .next 产物（排除 cache），用户安装后零编译直接运行——
      # 安装时构建在 macOS 上踩了一串坑（staging 目录/junction/执行位），成品发布根除。
      - name: Prebuild the production bundle
        run: |
          set -euo pipefail
          node --max-old-space-size=8192 node_modules/next/dist/bin/next build --webpack
          rm -rf .next/cache .next/diagnostics .next/trace .next/trace-build
          rm -rf .next-releases
          test -f .next/BUILD_ID
          du -sh .next

      # 打包前用真实 tarball 校验 .next 完整（files 是白名单，漏一个 Next 清单
      # 就会发出「装得上、起不来」的包），避免再出现 required-server-files.json 缺失。
      - name: Verify the packed artifact runs
        run: npm run verify:package

      - name: Confirm main still points at the tested source
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PIWEB_SKIP_INSTALL_BUILD: "1"
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/piweb-publish-agent
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Push the release tag
        run: |
          set -euo pipefail
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # npm 发布的同时创建 GitHub Release：说明文字 = 上一个版本以来的提交历史（去 merge 提交）
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="$prev..$tag"
          else
            range="$tag"
          fi
          notes="$(git log --format='- %s (%h)' --no-merges "$range")"
          gh release create "$tag" --title "v$version" --notes "$notes" --latest
        env:
          GH_TOKEN: ${{ github.token }}
