name: publish

# Every push to main becomes a release:
#   1. bump the patch version (the repository's package.json is the version source of truth)
#   2. run the prepublishOnly gate (typecheck + tests + build) and publish to npm
#   3. push the version commit and a v* tag back to main
# Publishing only happens after the gate passes, and an already-published version
# is bumped past, so a re-run or a concurrent push never fails on E403.
#
# Requires the repository secret NPM_TOKEN (npm Automation token). The bot commit
# it pushes back does not re-trigger this workflow (GITHUB_TOKEN pushes do not
# start new runs), and the actor guard covers manual re-runs on that commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write # push the version bump commit and the tag
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Bump the patch version past anything already published
        id: version
        run: |
          set -euo pipefail
          for _ in $(seq 1 50); do
            npm version patch --no-git-tag-version >/dev/null
            version="$(node -p "require('./package.json').version")"
            if ! npm view "piweb@$version" version >/dev/null 2>&1; then break; fi
            echo "piweb@$version is already published; bumping again"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing piweb@$version"

      # `npm publish` runs the `prepublishOnly` gate (typecheck + tests + build)
      # before uploading, so a broken build never reaches the registry.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/piweb-publish-agent
          PI_OFFLINE: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Push the version commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
          git push origin "v${{ steps.version.outputs.version }}"
